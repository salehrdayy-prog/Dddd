<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارنامه من</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-section {
            text-align: center; margin-bottom: 20px;
        }
        .profile-pic {
            width: 100px; height: 100px; border-radius: 50%;
            border: 3px solid #58a6ff; object-fit: cover; display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0; color:#3fb950;">📄 کارنامه‌ی من</h2>
            <button onclick="logout()" style="width:auto; padding:8px 15px; background:#da3633;">خروج</button>
        </div>

        <!-- بخش عکس پروفایل -->
        <div class="profile-section">
            <img id="profilePic" class="profile-pic" src="">
            <div style="margin-top:10px;">
                <input type="file" id="uploadPic" accept="image/*" style="display:none;">
                <button onclick="document.getElementById('uploadPic').click()" class="gradient-btn" style="width:auto;">📷 انتخاب عکس</button>
            </div>
        </div>

        <div id="welcomeBox" style="background:#0d1117; padding:15px; border-radius:10px; text-align:center; margin-bottom:20px;">
            <h3 id="welcomeMsg" style="color:#58a6ff;">سلام، دانش‌آموز عزیز!</h3>
        </div>

        <!-- بخش برنامه روزانه -->
        <div style="background:#0d1117; padding:20px; border-radius:10px; margin-bottom:20px;">
            <h3 style="color:#58a6ff;">🗓️ برنامه امروز</h3>
            <div id="todayScheduleDisplay" style="margin-top:10px;">
                <p style="color:#8b949e;">در حال بارگذاری...</p>
            </div>
        </div>

        <!-- بخش وظایف روزانه -->
        <div style="background:#0d1117; padding:20px; border-radius:10px; margin-bottom:20px;">
            <h3 style="color:#f0883e;">✅ وظایف روزانه</h3>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="dailyTaskInput" placeholder="مثلاً: حل تمرین ریاضی" style="flex:1;">
                <button onclick="addDailyTask()" style="width:auto; padding:8px 15px; background:#238636;">افزودن</button>
            </div>
            <div id="dailyTasksDisplay" style="margin-top:10px;"></div>
        </div>

        <!-- بخش نمرات و معدل -->
        <div style="background:#0d1117; padding:20px; border-radius:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #30363d; padding-bottom:10px; margin-bottom:10px;">
                <h3>📊 نمرات و معدل</h3>
                <span id="avgDisplay" style="background:#238636; padding:5px 15px; border-radius:20px; font-weight:bold;">معدل: -</span>
            </div>
            <table id="studentGradesTable">
                <thead>
                    <tr>
                        <th>درس</th>
                        <th>نمره</th>
                        <th>وضعیت</th>
                        <th>تاریخ</th>
                    </tr>
                </thead>
                <tbody id="gradesBody"></tbody>
            </table>
            <p id="noData" style="text-align:center; color:#8b949e; margin-top:20px; display:none;">هیچ نمره‌ای برای شما ثبت نشده است.</p>
        </div>
    </div>

    <!-- ترتیب صحیح: Firebase اول، بعد script.js، بعد کدهای سفارشی -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="script.js"></script>
    <script>
        window.onload = function() {
            const user = localStorage.getItem('currentUser');
            if (!user) { window.location.href = 'index.html'; return; }

            document.getElementById('welcomeMsg').innerText = `سلام ${user}، این نمرات شماست:`;

            // بارگذاری عکس پروفایل
            const savedPic = localStorage.getItem('student_profile_' + localStorage.getItem('classId'));
            if (savedPic) {
                document.getElementById('profilePic').src = savedPic;
                document.getElementById('profilePic').style.display = 'block';
            }

            // آپلود عکس
            document.getElementById('uploadPic').addEventListener('change', function(e) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgData = event.target.result;
                    localStorage.setItem('student_profile_' + localStorage.getItem('classId'), imgData);
                    document.getElementById('profilePic').src = imgData;
                    document.getElementById('profilePic').style.display = 'block';
                };
                reader.readAsDataURL(file);
            });

            // برنامه امروز
            loadTodaySchedule();
            
            // وظایف روزانه
            loadDailyTasks();

            // نمایش نمرات
            let allGrades = getGradesByClass(localStorage.getItem('classId'));
            const myGrades = allGrades.filter(g => g.name === user);
            const tbody = document.getElementById('gradesBody');

            if (myGrades.length === 0) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            let sum = 0;
            myGrades.forEach(item => {
                const status = item.grade >= 10 ? '<span style="color:#3fb950;">✅ قبول</span>' : '<span style="color:#f85149;">❌ مردود</span>';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.subject}</td>
                    <td style="font-weight:bold;">${item.grade}</td>
                    <td>${status}</td>
                    <td style="font-size:12px; color:#8b949e;">${item.date}</td>
                `;
                tbody.appendChild(row);
                sum += item.grade;
            });
            document.getElementById('avgDisplay').innerText = `معدل: ${(sum / myGrades.length).toFixed(2)}`;
        };

        // ============================================
        // برنامه روزانه و وظایف
        // ============================================

        function loadTodaySchedule() {
            const today = new Date().toLocaleDateString('fa-IR', { weekday: 'long' });
            const classId = localStorage.getItem('classId');
            const schedule = JSON.parse(localStorage.getItem(`weekly_schedule_${classId}`)) || [];
            
            const display = document.getElementById('todayScheduleDisplay');
            
            if (schedule.length === 0) {
                display.innerHTML = `<div style="background:#161b22; padding:10px; border-radius:6px;">
                    <strong>${today}</strong>: هیچ برنامه‌ای تنظیم نشده است.
                </div>`;
                return;
            }
            
            const todaySchedule = schedule.filter(item => item.day === today);
            
            if (todaySchedule.length === 0) {
                display.innerHTML = `<div style="background:#161b22; padding:10px; border-radius:6px;">
                    <strong>${today}</strong>: امروز کلاسی ندارید.
                </div>`;
                return;
            }
            
            let html = `<div style="background:#161b22; padding:10px; border-radius:6px;">
                <strong>${today}</strong>:
            </div>`;
            
            html += '<div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">';
            todaySchedule.forEach(item => {
                html += `<div style="background:#0d1117; padding:8px; border-radius:6px;">
                    ⏰ ${item.time} - 📚 ${item.subject}
                </div>`;
            });
            html += '</div>';
            display.innerHTML = html;
        }

        function addDailyTask() {
            const task = document.getElementById('dailyTaskInput').value.trim();
            if (!task) { alert("لطفاً وظیفه را وارد کنید!"); return; }
            
            const tasks = JSON.parse(localStorage.getItem('daily_tasks')) || [];
            tasks.push({ text: task, done: false });
            localStorage.setItem('daily_tasks', JSON.stringify(tasks));
            
            document.getElementById('dailyTaskInput').value = '';
            loadDailyTasks();
        }

        function loadDailyTasks() {
            const tasks = JSON.parse(localStorage.getItem('daily_tasks')) || [];
            const display = document.getElementById('dailyTasksDisplay');
            
            if (tasks.length === 0) {
                display.innerHTML = '<p style="color:#8b949e;">هیچ وظیفه‌ای ثبت نشده است.</p>';
                return;
            }
            
            let html = '<div style="display:flex; flex-direction:column; gap:8px;">';
            tasks.forEach((task, index) => {
                const checked = task.done ? 'checked' : '';
                const textStyle = task.done ? 'text-decoration: line-through; color: #8b949e;' : '';
                
                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#161b22; padding:8px; border-radius:6px;">
                        <div style="display:flex; gap:10px; align-items:center;">
                            <input type="checkbox" ${checked} onchange="toggleTask(${index})">
                            <span style="${textStyle}">${task.text}</span>
                        </div>
                        <button onclick="deleteTask(${index})" style="width:auto; padding:2px 8px; background:#da3633; font-size:10px;">حذف</button>
                    </div>
                `;
            });
            html += '</div>';
            display.innerHTML = html;
        }

        function toggleTask(index) {
            const tasks = JSON.parse(localStorage.getItem('daily_tasks')) || [];
            tasks[index].done = !tasks[index].done;
            localStorage.setItem('daily_tasks', JSON.stringify(tasks));
            loadDailyTasks();
        }

        function deleteTask(index) {
            const tasks = JSON.parse(localStorage.getItem('daily_tasks')) || [];
            tasks.splice(index, 1);
            localStorage.setItem('daily_tasks', JSON.stringify(tasks));
            loadDailyTasks();
        }
    </script>
</body>
</html>
